
name: Build Qingtuo APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          echo "Repository files:"
          ls -la
          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname '*.zip' -print
          test -f "qingtuo-modified-source (1).zip"

      - name: Inspect source ZIP
        run: |
          unzip -l "qingtuo-modified-source (1).zip" | head -80

      - name: Extract source ZIP
        run: |
          mkdir -p extracted
          unzip -o "qingtuo-modified-source (1).zip" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          find extracted -maxdepth 5 -type f \( -name 'gradlew' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
          echo "The actual Gradle project path must be confirmed from this output."
          test -f extracted/scl-main/settings.gradle.kts
          cd extracted/scl-main
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qingtuo-debug-apk
          path: extracted/scl-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
